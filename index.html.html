#login{max-width:380px;margin:8vh auto}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:999px;display:none;z-index:9}

const E={

agenda:{t:'Kalender Kelas',f:[['tgl','Tanggal','date'],['judul','Kegiatan'],['jenis','Jenis','sel',['Pelajaran','Ujian','Tugas','Kegiatan sekolah','Libur','Agenda kelas']]],c:['tgl','judul','jenis']},

materi:{t:'Materi Pembelajaran',f:[['judul','Judul Materi'],['mapel','Mata Pelajaran','sel',MP],['jenis','Jenis','sel',['PDF','PPT','Video','Gambar','Link','Teks']],['isi','Link atau isi materi','area'],['berkas','Unggah berkas (PDF/PPT/Video/Gambar)','file'],['tgl','Tanggal','date']],c:['tgl','judul','mapel','jenis','isi','berkas']},

const lab=(e,k)=>(E[e].f.find(f=>f[0]==k)||[0,k=='guru'?'Guru':k])[1];
const cell=(r,k)=>k=='sid'?esc(sn(r.sid)):k=='dok'||k=='berkas'?(r[k]?`<a href="${esc(r[k])}" target="_blank" rel="noopener">Buka</a>`:''):/^(tgl|batas|lahir)$/.test(k)?fd(r[k]):esc(r[k]);
function list(e,rows,ro,extra,xh){const d=E[e];rows=[...(rows||db[e])];if(d.c.includes('tgl'))rows.sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||''));rows=rows.slice(0,100);

function inp(f,v){const[k,l,t,o]=f;v=v??'';

return `<label>${l}<input name="${k}" type="${t||'text'}" value="${esc(v)}" ${k=='nama'||k=='judul'||k=='tgl'?'required':''}></label>`}

async function sv(ev,e,i){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target));for(const k in o)if(o[k] instanceof File){const f=o[k];try{o[k]=f.size?await upFile(f):((i&&db[e].find(x=>x.id==i)[k])||'')}catch(x){toast('Gagal unggah: '+x.message);return false}}

if(i)Object.assign(db[e].find(x=>x.id==i),o);else db[e].push({id:uid(),...o});save();$('#dlg').close();go(page);return false}

const cnt=(rows,k,v)=>rows.filter(x=>x[k]==v).length;

const stats=a=>`<div class="g4">${a.map(([n,l])=>`<div class="st"><b>${n}</b><span>${l}</span></div>`).join('')}</div>`;
const latest=e=>[...db[e]].sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||''));
const G={},W={};
G.dash=()=>{const t=today(),a=db.absensi.filter(x=>x.tgl==t),sis=db.siswa.filter(s=>s.aktif!='Nonaktif'),tg=db.tugas.filter(x=>x.batas>=t),bel=tg.reduce((n,x)=>n+sis.length-(x.done||[]).length,0),ps=db.pesan.filter(m=>m.dari=='wali'&&m.st=='Belum dibaca').length,jt=db.jurnal.filter(j=>j.tgl==t),pg=latest('pengumuman')[0];
return `<h2>Selamat datang, ${esc(me.nama)} 👋</h2><p class="mu">${fd(t)}</p>`+stats([[sis.length,'Siswa'],[cnt(a,'status','Hadir'),'Hadir'],[cnt(a,'status','Izin'),'Izin'],[cnt(a,'status','Sakit'),'Sakit'],[cnt(a,'status','Alpa'),'Alpa'],[jt.length,'Jurnal hari ini'],[tg.length,'Tugas aktif'],[bel,'Belum dikumpulkan'],[ps,'Pesan baru']])+`<div class="card"><h3>📖 Jurnal Hari Ini</h3>${MP.slice(0,3).map(m=>`<p>${m}: ${jt.some(j=>j.mapel==m)?'Selesai ✓':'<span class="mu">Belum diisi</span>'}</p>`).join('')}</div>${pg?`<div class="card"><h3>📢 ${esc(pg.judul)}</h3><p>${esc(pg.isi)}</p></div>`:''}`};
G.siswa=()=>`<div class="hd"><button class="g" onclick="waliDlg()">🔗 Link portal wali</button></div>`+list('siswa');G.materi=()=>list('materi');G.jurnal=()=>list('jurnal');G.nilai=()=>list('nilai');G.perkembangan=()=>list('perkembangan');G.agenda=()=>list('agenda');G.pengumuman=()=>list('pengumuman');G.users=()=>list('users');

return `<div class="card"><div class="hd"><h3>💬 Pesan ${w?'Guru':'Wali Murid'}</h3>${w?'':`<select onchange="S.ps=this.value;go('pesan')">${db.siswa.map(s=>`<option value="${s.id}" ${s.id==sid?'selected':''}>${esc(s.nama)}</option>`).join('')}</select>`}</div>${ms.map(m=>`<div class="m ${m.dari==me.role?'me':''}">${esc(m.teks)}<small>${m.dari=='guru'?'Guru':'Wali'} · ${new Date(m.w).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})} · ${m.st}</small></div>`).join('')||'<p class="mu">Belum ada pesan</p>'}<form onsubmit="return kirim(event,'${sid}')"><textarea name="t" rows="2" required placeholder="Tulis pesan..."></textarea><div class="row"><button class="p">Kirim</button></div></form></div>`};
function kirim(ev,sid){ev.preventDefault();const t=new FormData(ev.target).get('t');if(me.role=='guru')db.pesan.forEach(m=>{if(m.sid==sid&&m.dari=='wali')m.st='Dibalas'});db.pesan.push({id:uid(),sid,dari:me.role,teks:t,w:Date.now(),st:'Belum dibaca'});save();go('pesan');return false}
const mine=(e)=>db[e].filter(x=>x.sid==me.sid);
W.dash=()=>{const s=db.siswa.find(x=>x.id==me.sid),a=mine('absensi'),t=today(),lj=latest('jurnal')[0],jr=lj?db.jurnal.filter(j=>j.tgl==lj.tgl):[],tg=db.tugas.filter(x=>!(x.done||[]).includes(s.id)),pg=latest('pengumuman')[0],pr=a.length?Math.round(cnt(a,'status','Hadir')/a.length*100):0;
return `<h2>Selamat datang 👋</h2><p class="mu">Ayah/Bunda dari <b>${esc(s.nama)}</b></p>${notif()}<div class="card"><h3>📅 Kehadiran</h3>${stats(['Hadir','Izin','Sakit','Alpa'].map(x=>[cnt(a,'status',x),x]))}<div class="bar"><i style="width:${pr}%"></i></div><small>${pr}% kehadiran</small></div><div class="card"><h3>📖 Hari Ini di Kelas</h3>${lj?`<small>${fd(lj.tgl)}</small>`:''}${jr.map(j=>`<p><b>${esc(j.mapel)}</b><br>Materi: ${esc(j.materi)}</p>${j.rumah?`<div class="tip">💡 Bantu anak belajar di rumah: ${esc(j.rumah)}</div>`:''}`).join('')||'<p class="mu">Belum ada jurnal</p>'}</div><div class="card"><h3>📝 Tugas</h3><p>${tg.length} tugas belum selesai</p></div>${pg?`<div class="card"><h3>📢 ${esc(pg.judul)}</h3><p>${esc(pg.isi)}</p></div>`:''}`};
W.hadir=()=>{const a=mine('absensi');return stats(['Hadir','Izin','Sakit','Alpa','Dinas'].map(x=>[cnt(a,'status',x),x]))+list('absensi',a,1)};
W.jurnal=()=>list('jurnal',db.jurnal,1);
W.tugas=()=>list('tugas',db.tugas,1,r=>(r.done||[]).includes(me.sid)?'✓ Selesai':'Belum','Status');
function selesai(i){const t=db.tugas.find(x=>x.id==i);t.done=t.done||[];const k=t.done.indexOf(me.sid);k<0?t.done.push(me.sid):t.done.splice(k,1);save();go('tugas')}
W.nilai=()=>list('nilai',mine('nilai'),1);W.perkembangan=()=>list('perkembangan',mine('perkembangan'),1);
W.agenda=()=>list('agenda',db.agenda,1);W.materi=()=>list('materi',db.materi,1);
function notif(){const t=today(),n=[],s=me.sid,gm=db.pesan.filter(m=>m.sid==s&&m.dari=='guru'&&m.st=='Belum dibaca').length,jb=db.jurnal.filter(j=>j.tgl==t).length,tb=db.tugas.filter(x=>!(x.done||[]).includes(s)).length,nb=db.nilai.filter(x=>x.sid==s&&x.tgl==t).length,pb=db.pengumuman.filter(x=>x.tgl==t).length;
gm&&n.push(`💬 ${gm} pesan baru dari guru`);jb&&n.push(`📖 ${jb} jurnal hari ini`);tb&&n.push(`📝 ${tb} tugas belum selesai`);nb&&n.push(`📊 ${nb} nilai baru`);pb&&n.push(`📢 ${pb} pengumuman baru`);
return n.length?`<div class="card"><h3>🔔 Notifikasi</h3>${n.map(x=>`<p>${x}</p>`).join('')}</div>`:''}
W.profil=()=>{const s=db.siswa.find(x=>x.id==me.sid),a=mine('absensi'),pr=a.length?Math.round(cnt(a,'status','Hadir')/a.length*100):0,nl=mine('nilai').filter(x=>x.nilai!==''),tg=db.tugas.length,ok=db.tugas.filter(x=>(x.done||[]).includes(s.id)).length,pk=mine('perkembangan').sort((x,y)=>y.tgl.localeCompare(x.tgl)),by=MP.map(m=>{const v=nl.filter(x=>x.mapel==m);return[m,v.length?Math.round(v.reduce((q,x)=>q+ +x.nilai,0)/v.length):null]}).filter(x=>x[1]!==null);
return `<h2>👧 ${esc(s.nama)}</h2><p class="mu">Kelas III · NIS ${esc(s.nis)}</p><div class="card"><h3>Ringkasan</h3><small>Kehadiran ${pr}%</small><div class="bar"><i style="width:${pr}%"></i></div><small>Tugas ${ok}/${tg} selesai</small><div class="bar"><i style="width:${tg?ok/tg*100:0}%"></i></div></div><div class="card"><h3>📊 Grafik nilai rata-rata</h3>${by.map(([m,v])=>`<small>${m}: ${v}</small><div class="bar"><i style="width:${v}%"></i></div>`).join('')||'<p class="mu">Belum ada nilai</p>'}</div><div class="card"><h3>🌱 Riwayat Perkembangan</h3>${pk.map(p=>`<p>${fd(p.tgl)}<br>✓ <b>${esc(p.kat)}</b>: ${esc(p.catatan)}</p>`).join('')||'<p class="mu">Belum ada catatan</p>'}</div>`};W.pengumuman=()=>list('pengumuman',db.pengumuman,1);
const NAV={guru:[['dash','🏠 Dashboard'],['siswa','Siswa'],['absensi','Absensi'],['jurnal','Jurnal'],['materi','Materi'],['tugas','Tugas'],['nilai','Nilai'],['perkembangan','Perkembangan'],['agenda','Kalender'],['pengumuman','Pengumuman'],['pesan','Pesan'],['laporan','Laporan'],['set','Pengaturan']],
admin:[['dash','🏠 Dashboard'],['users','Akun'],['siswa','Siswa'],['laporan','Laporan'],['set','Pengaturan']],
wali:[['dash','🏠 Beranda'],['profil','👧 Anak Saya'],['hadir','Kehadiran'],['jurnal','Jurnal'],['materi','Materi'],['tugas','Tugas'],['nilai','Nilai'],['perkembangan','Perkembangan'],['agenda','Kalender'],['pengumuman','Pengumuman'],['pesan','Pesan Guru']]};
function go(p){page=p;const M=me.role=='wali'?W:G;
$('#app').innerHTML=`<header><b>📘 Jurnal Kelas Online</b><span>${esc(me.nama)} · ${me.role} ${me.role=='guru'?`<button class="g" style="color:inherit;border-color:currentColor" onclick="tok=null;me=null;login()">Keluar</button>`:''}</span></header><nav>${NAV[me.role].map(([k,l])=>`<button class="${k==p?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main>${(M[p]||M.dash)()}</main>`}
function login(msg){$('#app').innerHTML=`<div id="login" class="card"><h2>📘 Jurnal Kelas Online</h2><p class="mu">Data kelas tersimpan di Google Drive Anda sendiri.</p><p style="color:var(--rd)">${msg||''}</p><button class="p" style="width:100%" onclick="signIn()">Masuk dengan Google (Guru)</button><div class="tip"><small>Wali murid: buka link yang dikirim guru.</small></div></div>`}

const EMPTY=()=>({siswa:[],absensi:[],jurnal:[],materi:[],tugas:[],nilai:[],perkembangan:[],agenda:[],pengumuman:[],pesan:[],users:[],wali:{},cfg:{}});
let tok=null,tokExp=0,tc,T,DID,ROOT;
const DR='https://www.googleapis.com/drive/v3/files',UP='https://www.googleapis.com/upload/drive/v3/files',PUB=JSON.stringify({role:'reader',type:'anyone'});
function initAuth(){tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:()=>{}})}
function setTok(r){if(r.error)throw r;tok=r.access_token;tokExp=Date.now()+r.expires_in*1000-60000}
function signIn(){tc.callback=r=>{try{setTok(r)}catch(e){login('Gagal masuk Google');return}startGuru().catch(e=>login(e.message))};tc.requestAccessToken({prompt:''})}
const ensure=()=>new Promise((ok,no)=>{if(tok&&Date.now()<tokExp)return ok();tc.callback=r=>{try{setTok(r);ok()}catch(e){no(e)}};tc.requestAccessToken({prompt:''})});
async function dapi(url,o={}){await ensure();const r=await fetch(url,{...o,headers:{Authorization:'Bearer '+tok,...(o.headers||{})}});if(!r.ok)throw new Error('Drive '+r.status);return r}
const JH={'Content-Type':'application/json'};
async function findOne(q){return(await(await dapi(`${DR}?q=${encodeURIComponent(q)}&fields=files(id)`)).json()).files[0]}
async function mkFolder(name,parent){return(await(await dapi(DR+'?fields=id',{method:'POST',headers:JH,body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:parent?[parent]:undefined})})).json()).id}
async function multi(meta,part,id){const b='xxBOUNDxx',body=new Blob([`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${part.type||'application/json'}\r\n\r\n`,part,`\r\n--${b}--`]);
return(await(await dapi(`${UP}${id?'/'+id:''}?uploadType=multipart&fields=id,webViewLink`,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json())}
const upsertJson=async(name,parent,obj,id)=>(await multi(id?{name}:{name,parents:[parent]},new Blob([JSON.stringify(obj)],{type:'application/json'}),id)).id;
async function persist(){try{DID=await upsertJson('jurnal-data.json',ROOT,db,DID);toast('Tersimpan di Drive')}catch(e){toast('Gagal menyimpan: '+e.message)}}
async function upFile(f){toast('Mengunggah...');if(!db.cfg.ber)db.cfg.ber=await mkFolder('Berkas',ROOT);
const r=await multi({name:f.name,parents:[db.cfg.ber]},f);await dapi(`${DR}/${r.id}/permissions`,{method:'POST',headers:JH,body:PUB});return r.webViewLink}
async function startGuru(){me={role:'guru',nama:'Guru'};$('#app').innerHTML='<main><p class="mu">Membuka data dari Google Drive...</p></main>';
me.nama=(await(await dapi('https://www.googleapis.com/drive/v3/about?fields=user(displayName)')).json()).user.displayName;
const f=await findOne("name='Jurnal Kelas Online' and mimeType='application/vnd.google-apps.folder' and trashed=false");ROOT=f?f.id:await mkFolder('Jurnal Kelas Online');
const d=await findOne(`name='jurnal-data.json' and '${ROOT}' in parents and trashed=false`);
if(d){DID=d.id;db={...EMPTY(),...(await(await dapi(`${DR}/${DID}?alt=media`)).json())}}else{db=EMPTY();await persist()}
go('dash')}
function mkSnap(s){const f=a=>a.filter(x=>x.sid==s.id);return{siswa:[s],absensi:f(db.absensi),nilai:f(db.nilai),perkembangan:f(db.perkembangan),pesan:f(db.pesan).filter(m=>m.dari=='guru'),jurnal:db.jurnal.map(({catatan,refleksi,...j})=>j),materi:db.materi,agenda:db.agenda,pengumuman:db.pengumuman,tugas:db.tugas.map(t=>({...t,done:(t.done||[]).includes(s.id)?[s.id]:[]})),cfg:{hp:db.cfg.hp},users:[],wali:{}}}
async function syncWali(){if(!db.cfg.pw)db.cfg.pw=await mkFolder('Portal Wali',ROOT);
for(const s of db.siswa.filter(x=>x.aktif!='Nonaktif')){const id=db.wali[s.id],n=await upsertJson(`wali-${s.id}.json`,db.cfg.pw,mkSnap(s),id);if(!id){await dapi(`${DR}/${n}/permissions`,{method:'POST',headers:JH,body:PUB});db.wali[s.id]=n}}
await persist()}
async function waliDlg(){$('#dlg').innerHTML='<h3>Menyiapkan portal wali...</h3>';$('#dlg').showModal();
try{await syncWali()}catch(e){$('#dlg').innerHTML=`<h3>Gagal</h3><p>${esc(e.message)}</p><div class="row"><button class="g" onclick="$('#dlg').close()">Tutup</button></div>`;return}
const base=location.origin+location.pathname;
$('#dlg').innerHTML=`<h3>Link Portal Wali</h3><small>Kirim link masing-masing ke wali. Jangan dibagikan ke orang lain.</small>${db.siswa.filter(s=>s.aktif!='Nonaktif'&&db.wali[s.id]).map(s=>{const u=`${base}?w=${db.wali[s.id]}`,hp=(s.hp||'').replace(/\D/g,'').replace(/^0/,'62');return `<p><b>${esc(s.nama)}</b><br>${hp?`<a href="https://wa.me/${hp}?text=${encodeURIComponent('Assalamualaikum, berikut link Jurnal Kelas '+s.nama+': '+u)}" target="_blank" rel="noopener">Kirim via WhatsApp</a>`:'<small>Isi nomor HP wali untuk WhatsApp</small>'} · <a href="${u}" target="_blank" rel="noopener">Buka</a></p>`}).join('')||'<p class="mu">Belum ada siswa</p>'}<div class="row"><button class="p" onclick="$('#dlg').close()">Selesai</button></div>`}
function openDone(i){const t=db.tugas.find(x=>x.id==i);$('#dlg').innerHTML=`<h3>${esc(t.judul)}</h3><small>Centang siswa yang sudah mengumpulkan</small>${db.siswa.filter(s=>s.aktif!='Nonaktif').map(s=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" value="${s.id}" ${(t.done||[]).includes(s.id)?'checked':''}>${esc(s.nama)}</label>`).join('')}<div class="row"><button class="g" onclick="$('#dlg').close()">Batal</button><button class="p" onclick="db.tugas.find(x=>x.id=='${i}').done=[...document.querySelectorAll('#dlg input:checked')].map(e=>e.value);save();$('#dlg').close();go('tugas')">Simpan</button></div>`;$('#dlg').showModal()}
G.set=()=>`<div class="card"><h3>Pengaturan</h3><label>Nomor WhatsApp guru (untuk wali)<input id="ghp" value="${esc(db.cfg.hp||'')}"></label><div class="row"><button class="p" onclick="db.cfg.hp=$('#ghp').value;save();toast('Tersimpan')">Simpan</button></div></div><div class="card"><h3>Portal Wali</h3><p class="mu">Perbarui data yang dilihat wali, lalu kirim link masing-masing.</p><button class="p" onclick="waliDlg()">Perbarui dan lihat link wali</button></div><div class="card"><h3>Penyimpanan</h3><p class="mu">Data tersimpan di folder "Jurnal Kelas Online" pada Google Drive ${esc(me.nama)}.</p></div>`;
W.pesan=()=>{const ms=db.pesan.filter(m=>m.sid==me.sid&&m.dari=='guru').sort((a,b)=>a.w-b.w),hp=(db.cfg.hp||'').replace(/\D/g,'').replace(/^0/,'62');
return `<div class="card"><h3>💬 Pesan dari Guru</h3>${ms.map(m=>`<div class="m">${esc(m.teks)}<small>${new Date(m.w).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})}</small></div>`).join('')||'<p class="mu">Belum ada pesan</p>'}${hp?`<a style="display:inline-block;background:var(--pr);color:var(--pt);padding:8px 14px;border-radius:8px;text-decoration:none;margin-top:8px" href="https://wa.me/${hp}">Hubungi guru via WhatsApp</a>`:''}</div>`};
async function boot(){const w=new URLSearchParams(location.search).get('w');
if(w){try{const r=await fetch(`${DR}/${w}?alt=media&key=${API_KEY}`);if(!r.ok)throw 0;db=await r.json();const s=db.siswa[0];me={role:'wali',nama:s.wali||'Wali Murid',sid:s.id};go('dash')}catch(e){$('#app').innerHTML='<main><div class="card"><h3>Link tidak valid</h3><p class="mu">Minta link terbaru kepada guru.</p></div></main>'}return}
if(CLIENT_ID.startsWith('ISI')){login('Isi CLIENT_ID dan API_KEY di bagian atas skrip.');return}
const t=setInterval(()=>{if(window.google&&google.accounts){clearInterval(t);initAuth();login()}},100)}
boot();
</script></body></html>
